services:
  # FastAPI application
  fastapi:
    container_name: mini-rag-app
    build:
      context: ..
      dockerfile: docker/mini_rag/Dockerfile
    volumes:
      - fastapi_data:/app/assets
    env_file:
      - ./env/.env.app
      - ./env/.env.postgres
    depends_on:
      pgvector:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  # Nginx
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - fastapi
      - grafana
      - prometheus
    networks:
      - backend
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # PostgreSQL + pgvector
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: pgvector
    
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    env_file:
      - ./env/.env.postgres
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini-rag"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - backend
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - backend
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always
    env_file:
      - ./env/.env.grafana
    depends_on:
      - prometheus

  # Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - backend
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--no-collector.netstat'
      - '--no-collector.softnet'
      - '--no-collector.filesystem'
    restart: always
    
  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    env_file:
      - ./env/.env.postgres-exporter
    depends_on:
      pgvector:
        condition: service_healthy
    networks:
      - backend
    restart: always
  # RabbitMQ - Celery message broker
  rabbitmq:
    image: rabbitmq:4.1.2-management-alpine
    container_name: rabbitmq
    env_file:
      - ./env/.env.rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    expose:
      - "5672"
      - "15672"
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Redis - Celery results backend and cache
  redis:
    image: redis:8.0.3-alpine
    container_name: redis
    env_file:
      - ./env/.env.redis
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - backend
    restart: always
    command:
      - sh
      - -c
      - >
        exec redis-server
        --appendonly "$$REDIS_APPENDONLY"
        --requirepass "$$REDIS_PASSWORD"
        --maxmemory "$$REDIS_MAXMEMORY"
        --maxmemory-policy "$$REDIS_MAXMEMORY_POLICY"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  celery-file-worker:
    build:
      context: ..
      dockerfile: docker/mini_rag/Dockerfile
    container_name: mini-rag-celery-file-worker
    command:
      - celery
      - -A
      - celery_app:celery_app
      - worker
      - --loglevel=info
      - --queues=file_processing
      - --concurrency=2
      - --hostname=file-worker@%h
    env_file:
      - ./env/.env.app
      - ./env/.env.postgres
    volumes:
      - fastapi_data:/app/assets
    depends_on:
      pgvector:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: always
    stop_grace_period: 60s

  celery-index-worker:
    build:
      context: ..
      dockerfile: docker/mini_rag/Dockerfile
    container_name: mini-rag-celery-index-worker
    command:
      - celery
      - -A
      - celery_app:celery_app
      - worker
      - --loglevel=info
      - --queues=index_processing
      - --concurrency=1
      - --hostname=index-worker@%h
    env_file:
      - ./env/.env.app
      - ./env/.env.postgres
    volumes:
      - fastapi_data:/app/assets
    depends_on:
      pgvector:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: always
    stop_grace_period: 180s

  celery-maintenance-worker:
    build:
      context: ..
      dockerfile: docker/mini_rag/Dockerfile
    container_name: mini-rag-celery-maintenance-worker
    command:
      - celery
      - -A
      - celery_app:celery_app
      - worker
      - --loglevel=info
      - --queues=maintenance
      - --concurrency=1
      - --hostname=maintenance-worker@%h
    env_file:
      - ./env/.env.app
      - ./env/.env.postgres
    depends_on:
      pgvector:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: always
    stop_grace_period: 30s

  celery-beat:
    build:
      context: ..
      dockerfile: docker/mini_rag/Dockerfile
    container_name: mini-rag-celery-beat
    command:
      - celery
      - -A
      - celery_app:celery_app
      - beat
      - --loglevel=info
      - --schedule=/var/lib/celery/celerybeat-schedule
    env_file:
      - ./env/.env.app
      - ./env/.env.postgres
    volumes:
      - celery_beat_data:/var/lib/celery
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: always
    stop_grace_period: 30s

  flower:
    build:
      context: ..
      dockerfile: docker/mini_rag/Dockerfile
    container_name: mini-rag-flower
    command:
      - celery
      - -A
      - celery_app:celery_app
      - flower
      - --port=5555
      - --url-prefix=flower
    env_file:
      - ./env/.env.app
      - ./env/.env.postgres
    expose:
      - "5555"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: always
volumes:
  pgvector_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  fastapi_data:
  rabbitmq_data:
  redis_data:
  celery_beat_data:

networks:
  backend:
    driver: bridge
