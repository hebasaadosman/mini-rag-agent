server {
    listen 80 default_server;
    server_name _;

    # The public entry point serves the application only.  Monitoring tools
    # remain internal services, so their availability must never prevent the
    # API or Swagger UI from starting.
    location / {
        proxy_pass http://fastapi:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus scrapes FastAPI directly on the private Docker network.
    # Do not expose application metrics from the public listener.
    location = /metrics {
        return 404;
    }
}
