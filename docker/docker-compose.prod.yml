services:
  fastapi:
    container_name: !reset null
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    build: !reset null
    # Each Uvicorn process initializes the complete AI runtime, including the
    # PostgreSQL checkpointer. Keep a single web worker on the 4 GB instance;
    # Celery workers handle the independent background workloads.
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    environment:
      APP_ENV: production
    ports: !override
      - "127.0.0.1:8001:8000"
    restart: always

  celery-file-worker:
    container_name: !reset null
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    build: !reset null
    restart: always

  celery-index-worker:
    container_name: !reset null
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    build: !reset null
    restart: always

  celery-maintenance-worker:
    container_name: !reset null
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    build: !reset null
    restart: always

  celery-beat:
    container_name: !reset null
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    build: !reset null
    restart: always

  flower:
    container_name: !reset null
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    build: !reset null
    ports: !override []
    restart: always

  pgvector:
    container_name: !reset null
    ports: !override []
    restart: always

  qdrant:
    container_name: !reset null
    ports: !override []
    restart: always

  prometheus:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:9090:9090"
    restart: always

  grafana:
    container_name: !reset null
    environment:
      GF_SERVER_ROOT_URL: "http://16.170.95.79/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports: !override
      - "127.0.0.1:3000:3000"
    restart: always

  node-exporter:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:9100:9100"
    restart: always

  postgres-exporter:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:9187:9187"
    restart: always

  rabbitmq:
    container_name: !reset null
    ports: !override []
    restart: always

  redis:
    container_name: !reset null
    ports: !override []
    restart: always
