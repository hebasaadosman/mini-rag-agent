name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # A workflow_run is created after CI, so use the exact commit CI validated
  # rather than the latest commit that happens to be on main.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      image: ${{ steps.image.outputs.value }}
      revision: ${{ steps.revision.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Record validated revision
        id: revision
        shell: bash
        run: echo "value=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail

          IMAGE="${REGISTRY}/${IMAGE_NAME,,}:${DEPLOY_SHA}"

          echo "value=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Docker image: ${IMAGE}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mini_rag/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.value }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Install SSH key
        shell: bash
        run: |
          set -Eeuo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.PROD_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Deploy application
        shell: bash
        env:
          APP_IMAGE: ${{ needs.build-and-push.outputs.image }}
          DEPLOY_SHA: ${{ needs.build-and-push.outputs.revision }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          PROD_AUTH_JWT_SECRET: ${{ secrets.PROD_AUTH_JWT_SECRET }}
          PROD_ENV_APP: ${{ secrets.PROD_ENV_APP }}
          PROD_ENV_POSTGRES: ${{ secrets.PROD_ENV_POSTGRES }}
          PROD_ENV_GRAFANA: ${{ secrets.PROD_ENV_GRAFANA }}
          PROD_ENV_POSTGRES_EXPORTER: ${{ secrets.PROD_ENV_POSTGRES_EXPORTER }}
          PROD_ENV_RABBITMQ: ${{ secrets.PROD_ENV_RABBITMQ }}
          PROD_ENV_REDIS: ${{ secrets.PROD_ENV_REDIS }}
        run: |
          set -Eeuo pipefail

          REQUIRED_ENV_SECRETS=(
            PROD_AUTH_JWT_SECRET
            PROD_ENV_APP
            PROD_ENV_POSTGRES
            PROD_ENV_GRAFANA
            PROD_ENV_POSTGRES_EXPORTER
            PROD_ENV_RABBITMQ
            PROD_ENV_REDIS
          )

          for secret_name in "${REQUIRED_ENV_SECRETS[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Required production environment secret is missing: ${secret_name}"
              exit 1
            fi
          done

          encode_env_file() {
            printf '%s' "$1" | base64 | tr -d '\n'
          }

          PROD_ENV_APP_B64="$(encode_env_file "$PROD_ENV_APP")"
          PROD_AUTH_JWT_SECRET_B64="$(encode_env_file "$PROD_AUTH_JWT_SECRET")"
          PROD_ENV_POSTGRES_B64="$(encode_env_file "$PROD_ENV_POSTGRES")"
          PROD_ENV_GRAFANA_B64="$(encode_env_file "$PROD_ENV_GRAFANA")"
          PROD_ENV_POSTGRES_EXPORTER_B64="$(encode_env_file "$PROD_ENV_POSTGRES_EXPORTER")"
          PROD_ENV_RABBITMQ_B64="$(encode_env_file "$PROD_ENV_RABBITMQ")"
          PROD_ENV_REDIS_B64="$(encode_env_file "$PROD_ENV_REDIS")"

          for encoded_secret in \
            "$PROD_AUTH_JWT_SECRET_B64" \
            "$PROD_ENV_APP_B64" \
            "$PROD_ENV_POSTGRES_B64" \
            "$PROD_ENV_GRAFANA_B64" \
            "$PROD_ENV_POSTGRES_EXPORTER_B64" \
            "$PROD_ENV_RABBITMQ_B64" \
            "$PROD_ENV_REDIS_B64"; do
            echo "::add-mask::${encoded_secret}"
          done

          ssh "${PROD_USER}@${PROD_HOST}" \
            "APP_IMAGE='${APP_IMAGE}' \
             DEPLOY_SHA='${DEPLOY_SHA}' \
             PROD_PATH='${PROD_PATH}' \
             GHCR_USERNAME='${GHCR_USERNAME}' \
             GHCR_TOKEN='${GHCR_TOKEN}' \
             PROD_AUTH_JWT_SECRET_B64='${PROD_AUTH_JWT_SECRET_B64}' \
             PROD_ENV_APP_B64='${PROD_ENV_APP_B64}' \
             PROD_ENV_POSTGRES_B64='${PROD_ENV_POSTGRES_B64}' \
             PROD_ENV_GRAFANA_B64='${PROD_ENV_GRAFANA_B64}' \
             PROD_ENV_POSTGRES_EXPORTER_B64='${PROD_ENV_POSTGRES_EXPORTER_B64}' \
             PROD_ENV_RABBITMQ_B64='${PROD_ENV_RABBITMQ_B64}' \
             PROD_ENV_REDIS_B64='${PROD_ENV_REDIS_B64}' \
             bash -s" <<'REMOTE_SCRIPT'

          set -Eeuo pipefail

          COMPOSE_FILES=(
            -f docker/docker-compose.yml
            -f docker/docker-compose.prod.yml
          )

          cd "$PROD_PATH"

          echo "Updating production repository..."

          git fetch origin main
          git reset --hard "$DEPLOY_SHA"

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"

          echo "Workflow commit:    $DEPLOY_SHA"
          echo "Checked-out commit: $CHECKED_OUT_SHA"
          echo "Deploying image:    $APP_IMAGE"

          if [ "$CHECKED_OUT_SHA" != "$DEPLOY_SHA" ]; then
            echo "Repository commit does not match workflow commit."
            echo "Expected: $DEPLOY_SHA"
            echo "Actual:   $CHECKED_OUT_SHA"
            exit 1
          fi

          echo "Writing production environment files..."

          install -m 700 -d docker/env

          write_env_file() {
            local encoded_content="$1"
            local target_path="$2"
            local temporary_path="${target_path}.tmp"

            printf '%s' "$encoded_content" \
              | base64 --decode \
              > "$temporary_path"

            if [ ! -s "$temporary_path" ]; then
              echo "Decoded environment file is empty: $target_path"
              rm -f "$temporary_path"
              exit 1
            fi

            chmod 600 "$temporary_path"
            mv "$temporary_path" "$target_path"
          }

          write_env_file "$PROD_ENV_APP_B64" docker/env/.env.app
          write_env_file "$PROD_ENV_POSTGRES_B64" docker/env/.env.postgres
          write_env_file "$PROD_ENV_GRAFANA_B64" docker/env/.env.grafana
          write_env_file "$PROD_ENV_POSTGRES_EXPORTER_B64" docker/env/.env.postgres-exporter
          write_env_file "$PROD_ENV_RABBITMQ_B64" docker/env/.env.rabbitmq
          write_env_file "$PROD_ENV_REDIS_B64" docker/env/.env.redis

          PROD_AUTH_JWT_SECRET="$(
            printf '%s' "$PROD_AUTH_JWT_SECRET_B64" | base64 --decode
          )"

          if [ "${#PROD_AUTH_JWT_SECRET}" -lt 32 ]; then
            echo "PROD_AUTH_JWT_SECRET must contain at least 32 characters."
            exit 1
          fi

          export PROD_AUTH_JWT_SECRET

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          path = Path("docker/env/.env.app")

          def read_env_file(path: Path) -> dict[str, str]:
              values: dict[str, str] = {}
              for raw_line in path.read_text().splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  value = value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in {"'", '"'}:
                      value = value[1:-1]
                  values[key.strip()] = value
              return values

          rabbitmq = read_env_file(Path("docker/env/.env.rabbitmq"))
          redis = read_env_file(Path("docker/env/.env.redis"))
          rabbitmq_user = rabbitmq["RABBITMQ_DEFAULT_USER"]
          rabbitmq_password = rabbitmq["RABBITMQ_DEFAULT_PASS"]
          rabbitmq_vhost = rabbitmq.get("RABBITMQ_DEFAULT_VHOST", "mini_rag").lstrip("/")
          redis_password = redis["REDIS_PASSWORD"]

          updates = {
              "AUTH_ENABLED": "true",
              "AUTHZ_ENABLED": "true",
              "AUTH_JWT_SECRET": os.environ["PROD_AUTH_JWT_SECRET"],
              "CELERY_BROKER_URL": (
                  f"amqp://{quote(rabbitmq_user, safe='')}:"
                  f"{quote(rabbitmq_password, safe='')}@rabbitmq:5672/"
                  f"{quote(rabbitmq_vhost, safe='')}"
              ),
              "CELERY_RESULT_BACKEND": (
                  f"redis://:{quote(redis_password, safe='')}@redis:6379/0"
              ),
          }
          lines = path.read_text().splitlines()
          remaining = dict(updates)
          rendered = []

          for line in lines:
              key = line.split("=", 1)[0].strip()
              if key in remaining:
                  rendered.append(f"{key}={json.dumps(remaining.pop(key))}")
              else:
                  rendered.append(line)

          rendered.extend(
              f"{key}={json.dumps(value)}"
              for key, value in remaining.items()
          )
          path.write_text("\n".join(rendered) + "\n")
          PY

          unset PROD_AUTH_JWT_SECRET

          unset \
            PROD_AUTH_JWT_SECRET_B64 \
            PROD_ENV_APP_B64 \
            PROD_ENV_POSTGRES_B64 \
            PROD_ENV_GRAFANA_B64 \
            PROD_ENV_POSTGRES_EXPORTER_B64 \
            PROD_ENV_RABBITMQ_B64 \
            PROD_ENV_REDIS_B64


          echo "Logging in to GHCR..."

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

          export APP_IMAGE
          echo "Updating .env.production..."

          printf 'APP_IMAGE=%s\n' "$APP_IMAGE" \
            > docker/.env.production
          echo "Resolved Docker Compose images:"

          RESOLVED_IMAGES="$(
            docker compose \
              "${COMPOSE_FILES[@]}" \
              config \
              --images
          )"

          printf '%s\n' "$RESOLVED_IMAGES"

          if ! grep \
            -Fqx \
            -- "$APP_IMAGE" \
            <<< "$RESOLVED_IMAGES"; then

            echo "Docker Compose is not using the expected FastAPI image."
            echo "Expected image: $APP_IMAGE"
            exit 1
          fi

          echo "Docker Compose resolved the expected FastAPI image."
                

          echo "Pulling FastAPI image..."

          docker compose \
            "${COMPOSE_FILES[@]}" \
            pull \
            fastapi

          echo "Starting isolated application dependencies..."

          # Do not make the deployment depend on Docker's RabbitMQ health
          # status.  On the small production instance its diagnostic health
          # command may time out while the broker is otherwise reachable.
          docker compose \
            "${COMPOSE_FILES[@]}" \
            up \
            -d \
            --no-build \
            pgvector \
            qdrant \
            rabbitmq \
            redis

          echo "Waiting for RabbitMQ broker..."

          RABBITMQ_CONTAINER_ID="$(
            docker compose \
              "${COMPOSE_FILES[@]}" \
              ps \
              -q \
              rabbitmq
          )"

          if [ -z "$RABBITMQ_CONTAINER_ID" ]; then
            echo "RabbitMQ container was not created."
            exit 1
          fi

          for attempt in {1..18}; do
            if docker exec \
              "$RABBITMQ_CONTAINER_ID" \
              rabbitmq-diagnostics \
              -q \
              ping; then
              echo "RabbitMQ broker is reachable."
              break
            fi

            if [ "$attempt" -eq 18 ]; then
              echo "RabbitMQ broker did not become reachable."
              docker compose \
                "${COMPOSE_FILES[@]}" \
                logs \
                --tail=200 \
                rabbitmq
              exit 1
            fi

            sleep 5
          done

          echo "Running Alembic migrations..."

          MIGRATION_CONTAINER="mini-rag-agent-migration-${DEPLOY_SHA:0:12}"

          docker rm \
            -f \
            "$MIGRATION_CONTAINER" \
            >/dev/null 2>&1 || true

          docker compose \
            "${COMPOSE_FILES[@]}" \
            run \
            -d \
            --name "$MIGRATION_CONTAINER" \
            --no-deps \
            --workdir /app/models/db_schemes/mini_rag \
            --entrypoint python \
            fastapi \
            -c '
          import sys

          from alembic import command
          from alembic.config import Config

          try:
              print("Starting Alembic upgrade...", flush=True)

              alembic_config = Config(
                  "/app/models/db_schemes/mini_rag/alembic.ini"
              )

              command.upgrade(alembic_config, "head")

              print(
                  "Alembic upgrade completed.",
                  flush=True,
              )

          except Exception as exc:
              print(
                  f"Alembic migration failed: {exc}",
                  file=sys.stderr,
                  flush=True,
              )

              sys.exit(1)

          sys.exit(0)
          ' < /dev/null

          echo "Waiting for migration container..."

          set +e

          MIGRATION_STATUS="$(
            timeout \
              --signal=TERM \
              --kill-after=10s \
              180 \
              docker wait "$MIGRATION_CONTAINER"
          )"

          WAIT_STATUS=$?

          set -e

          echo "Migration logs:"

          docker logs \
            "$MIGRATION_CONTAINER" \
            || true

          if [ "$WAIT_STATUS" -eq 124 ]; then
            echo "Alembic timed out after 180 seconds."

            docker rm \
              -f \
              "$MIGRATION_CONTAINER" \
              >/dev/null 2>&1 || true

            exit 1
          fi

          if [ "$WAIT_STATUS" -ne 0 ]; then
            echo "Failed while waiting for migration container."

            docker rm \
              -f \
              "$MIGRATION_CONTAINER" \
              >/dev/null 2>&1 || true

            exit "$WAIT_STATUS"
          fi

          docker rm \
            "$MIGRATION_CONTAINER" \
            >/dev/null

          if [ "$MIGRATION_STATUS" -ne 0 ]; then
            echo "Alembic failed with status: $MIGRATION_STATUS"
            exit "$MIGRATION_STATUS"
          fi

          echo "Migration finished."

          echo "Recreating application containers..."

          APPLICATION_SERVICES=(
            fastapi
            celery-file-worker
            celery-index-worker
          )

          docker compose \
            "${COMPOSE_FILES[@]}" \
            up \
            -d \
            --no-build \
            --no-deps \
            --force-recreate \
            "${APPLICATION_SERVICES[@]}"
          echo "Waiting for FastAPI container..."

          sleep 5

          FASTAPI_CONTAINER_ID="$(
            docker compose \
              "${COMPOSE_FILES[@]}" \
              ps \
              -q \
              fastapi
          )"

          if [ -z "$FASTAPI_CONTAINER_ID" ]; then
            echo "FastAPI container was not created."

            docker compose \
              "${COMPOSE_FILES[@]}" \
              ps

            exit 1
          fi

          RUNNING_IMAGE="$(
            docker inspect \
              --format '{{.Config.Image}}' \
              "$FASTAPI_CONTAINER_ID"
          )"

          echo "Expected image: $APP_IMAGE"
          echo "Running image:  $RUNNING_IMAGE"

          if [ "$RUNNING_IMAGE" != "$APP_IMAGE" ]; then
            echo "FastAPI is running an old or incorrect image."

            docker inspect \
              "$FASTAPI_CONTAINER_ID"

            exit 1
          fi

          RUNNING_STATUS="$(
            docker inspect \
              --format '{{.State.Status}}' \
              "$FASTAPI_CONTAINER_ID"
          )"

          echo "FastAPI container status: $RUNNING_STATUS"

          if [ "$RUNNING_STATUS" != "running" ]; then
            echo "FastAPI container is not running."

            docker compose \
              "${COMPOSE_FILES[@]}" \
              logs \
              --tail=200 \
              fastapi

            exit 1
          fi

          echo "FastAPI Compose status:"

          docker compose \
            "${COMPOSE_FILES[@]}" \
            ps \
            fastapi

          echo "Recent FastAPI logs:"

          docker compose \
            "${COMPOSE_FILES[@]}" \
            logs \
            --tail=100 \
            fastapi

          echo "Removing unused Docker images..."

          docker image prune \
            -f

          echo "Recreating public reverse proxy..."

          docker compose \
            "${COMPOSE_FILES[@]}" \
            up \
            -d \
            --no-build \
            --no-deps \
            --force-recreate \
            nginx

          echo "Deployment completed successfully."

          REMOTE_SCRIPT

      - name: Production health check
        shell: bash
        env:
          APP_IMAGE: ${{ needs.build-and-push.outputs.image }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: |
          set -Eeuo pipefail

          for attempt in {1..18}; do
            echo "Health check attempt ${attempt}/18..."

            if ssh "${PROD_USER}@${PROD_HOST}" \
              "cd '${PROD_PATH}' && \
               APP_IMAGE='${APP_IMAGE}' \
               docker compose \
                 -f docker/docker-compose.yml \
                 -f docker/docker-compose.prod.yml \
                 exec \
                 -T \
                 fastapi \
                 curl \
                   --fail \
                   --silent \
                   --show-error \
                   --max-time 10 \
                   http://127.0.0.1:8000/api/v1/health \
                   > /dev/null"; then

              echo "Production is healthy."
              exit 0
            fi

            sleep 10
          done

          echo "Production health check failed."

          ssh "${PROD_USER}@${PROD_HOST}" \
            "cd '${PROD_PATH}' &&
             APP_IMAGE='${APP_IMAGE}' \
             docker compose \
               -f docker/docker-compose.yml \
               -f docker/docker-compose.prod.yml \
               ps &&
             APP_IMAGE='${APP_IMAGE}' \
             docker compose \
               -f docker/docker-compose.yml \
               -f docker/docker-compose.prod.yml \
               logs \
               --tail=200 \
               fastapi"

          exit 1
